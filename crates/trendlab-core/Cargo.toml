[package]
name = "trendlab-core"
version = "0.1.0"
edition = "2021"
description = "TrendLab signal engine and point-in-time backtester"

[lib]
name = "trendlab_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.pyo3]
version = "0.23"
optional = true

[features]
default = []
python = ["pyo3", "pyo3/extension-module"]

[dev-dependencies]
approx = "0.5"
