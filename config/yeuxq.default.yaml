# yeuxQ 可选公开配置（未指定 YEUXQ_CONFIG 时使用代码内默认值）
app:
  name: "yeuxQ"
  version: "2.0.0"
  host: "127.0.0.1"
  port: 8795
  # 非回环绑定还必须配置明确的 allowed_hosts、TLS 文件和
  # 环境变量 YEUXQ_ACCESS_TOKEN（至少 32 字符）。
  allowed_hosts: []
  tls_certfile: null
  tls_keyfile: null

engine:
  weights:
    trend: 0.25
    momentum: 0.20
    breakout: 0.20
    volume_price: 0.20
    pattern: 0.15
  # 动作分级阈值
  action:
    strong_buy_score: 75
    strong_buy_confidence: 60
    strong_buy_modules: 4
    buy_score: 65
    buy_confidence: 45
    buy_modules: 3
    cautious_score: 60
  # 止损策略: fixed_pct | atr_2n | structure | hybrid
  stop_loss: hybrid
  fixed_stop_pct: 0.05
  # 缠论信号是否参与加减分
  # 对比回测显示加减分会增加劣质交易，默认关闭
  chanlun_bonus: false
  # 结构破坏时给出卖出（修正偏多）
  sell_symmetric: true
  # 按 ATR 给仓位建议
  atr_position: true

prediction:
  # 规则线性打分 → sigmoid
  horizon_days: 5
  bias: -0.2
  coeffs:
    score: 0.035
    trend: 0.008
    momentum: 0.006
    volume_price: 0.005
    breakout: 0.004
    m_score: 0.006
    main_flow_streak: 0.04

data:
  request_timeout: 8.0
  memory_ttl_seconds: 15
  quote_ttl_seconds: 2
  rate_limit_per_second: 8
  # 相对路径始终落到 YEUXQ_DATA_DIR。
  kline_store: "kline.db"
  tencent_kline: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get"
  sina_kline: "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData"
  search_host: "https://searchapi.eastmoney.com"
  quote_hosts:
    - "https://push2delay.eastmoney.com"
    - "https://push2.eastmoney.com"
    - "https://push2test.eastmoney.com"
  his_hosts:
    - "https://push2test.eastmoney.com"
    - "https://push2his.eastmoney.com"
    - "https://82.push2his.eastmoney.com"
    - "https://90.push2his.eastmoney.com"
    - "https://push2delay.eastmoney.com"
  rt_flow_hosts:
    - "https://push2delay.eastmoney.com"
    - "https://push2.eastmoney.com"

scan:
  # 默认禁止全 A 裸扫
  allow_full_market: false
  max_workers: 6
  max_symbols: 200
  default_pool: ["600519", "000001", "601318", "300750", "600036", "000858"]

risk:
  hard_veto:
    - "跌破MA20"
    - "价跌量增"
    - "OBV下降"
    - "OBV走低"
    - "OBV下行"
  soft_veto:
    - "MA20向下"
    - "MA20下行"
    - "受压60日"

research:
  # 研报 / 资讯 / 财报默认保留一天；列表与再次生成时清掉过期文件
  ttl_hours: 24
  # 同一标的再次生成同类型（速报/财报/资讯/晨报）时覆盖旧稿
  replace_same_kind: true
  max_brief_symbols: 8
  report_dir: "reports"
  max_report_bytes: 2097152
  # 以下仅为公开端点/模型配置；密钥只从 YEUXQ_* 环境变量读取。
  llm_base_url: "https://grok.yeuxark.com/v1"
  llm_model: "grok-4.6"
  llm_reasoning_effort: "xhigh"
  llm_timeout: 240
  yeux_mcp_url: "https://search.yeuxark.com/mcp"
  yeux_timeout: 360
