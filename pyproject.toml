[project]
name = "quantify"
version = "0.1.0"
description = "Teaching-grade A-share quant research and simulation system: multi-factor research, paper trading, and deterministic PASS/WATCH/BLOCK release gates."
readme = "README.md"
authors = [
    { name = "zzzfu411", email = "1015328153@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.60",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
]
